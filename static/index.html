<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skill-memory agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* ---- Documentation Minimalist tokens (DESIGN.md) ---- */
  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;            /* canvas */
    --surface: #fafafa;       /* surface-soft (sidebar, cards) */
    --surface-2: #f3f3f3;     /* hover */
    --surface-3: #eeeeee;     /* active */
    --border: #e5e5e5;        /* hairline */
    --border-strong: #d4d4d4; /* hairline-strong */
    --text: #000000;          /* ink */
    --text-2: #525252;        /* charcoal */
    --text-3: #737373;        /* body */
    --text-mute: #a3a3a3;     /* mute */
    --accent: #000000;        /* primary — black is the brand */
    --accent-fg: #ffffff;     /* on-primary */
    --accent-hover: #1b1b1b;  /* pressed */
    --user-bg: #000000;       /* the single inverted moment */
    --user-fg: #ffffff;
    --danger: #ba1a1a;        /* error */
    --danger-fg: #ffffff;
    --overlay: rgba(27,27,27,0.32);
    --shadow: 0 6px 24px rgba(0,0,0,0.12);
    --badge-bg: #f3f3f3;
    --c-sys: #0b6e99;
    --c-act: #2f7d32;
    --c-arc: #b45309;
    --c-merge: #92690b;
    --google-theme: outline;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0c0c;
    --surface: #171717;       /* surface-dark */
    --surface-2: #1f1f1f;
    --surface-3: #262626;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #f5f5f5;
    --text-2: #d4d4d4;
    --text-3: #a3a3a3;
    --text-mute: #6e6e6e;
    --accent: #f5f5f5;        /* invert: white pill on dark */
    --accent-fg: #0c0c0c;
    --accent-hover: #ffffff;
    --user-bg: #f5f5f5;
    --user-fg: #0c0c0c;
    --danger: #ff5449;
    --danger-fg: #1b0000;
    --overlay: rgba(0,0,0,0.6);
    --shadow: 0 6px 24px rgba(0,0,0,0.5);
    --badge-bg: #1f1f1f;
    --c-sys: #88c0d0;
    --c-act: #a3be8c;
    --c-arc: #d08770;
    --c-merge: #ebcb8b;
    --google-theme: filled_black;
  }

  /* radii — pill geometry everywhere */
  :root {
    --r-pill: 9999px;
    --r-card: 12px;
    --r-sm: 8px;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-display: "Plus Jakarta Sans", var(--font-body);
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 var(--font-body);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 0.18s ease, color 0.18s ease;
  }
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
    min-height: 0;
  }
  #menuToggle { display: none; }
  #sidebarBackdrop { display: none; }
  aside .section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 0 0 auto;
  }
  aside .section.open {
    flex: 1 1 0;
  }
  aside .section + .section { margin-top: 4px; }
  aside .section-toggle {
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-3);
    letter-spacing: 0.05em;
    padding: 6px 4px;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  aside .section-toggle::before {
    content: '▸';
    font-size: 9px;
    color: var(--text-mute);
    transition: transform 0.15s;
    display: inline-block;
  }
  aside .section.open > .section-toggle::before {
    transform: rotate(90deg);
  }
  aside .section-toggle:hover { color: var(--text); }
  aside .section-content {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-right: 2px;
  }
  aside .section:not(.open) > .section-content { display: none; }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li {
    padding: 6px 8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 13px;
  }
  aside li:hover { background: var(--surface-2); }
  aside li.active { background: var(--surface-3); }
  aside .tier { font-size: 10px; color: var(--text-mute); margin-right: 6px; }
  aside .meta { font-size: 11px; color: var(--text-mute); }
  aside button.del {
    background: transparent;
    border: none;
    color: var(--text-mute);
    cursor: pointer;
    float: right;
    font-size: 11px;
  }
  aside button.del:hover { color: var(--danger); }
  main { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .who { font-weight: 600; font-family: var(--font-display); }
  header button {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 5px 14px;
    border-radius: var(--r-pill);
    cursor: pointer;
    font-size: 12px;
    transition: background 0.12s ease;
  }
  header button:hover { background: var(--surface-3); }
  header select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 5px 12px;
    border-radius: var(--r-pill);
    cursor: pointer;
    font-size: 12px;
  }
  /* theme toggle — icon pill */
  #themeToggle {
    padding: 5px 10px;
    line-height: 1;
    font-size: 14px;
  }
  #themeToggle .icon-dark { display: none; }
  :root[data-theme="dark"] #themeToggle .icon-light { display: none; }
  :root[data-theme="dark"] #themeToggle .icon-dark { display: inline; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 720px; }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-fg);
    padding: 8px 14px;
    border-radius: var(--r-card);
  }
  .msg.user .role { color: inherit; opacity: 0.6; }
  .msg.agent { align-self: flex-start; }
  .msg .role { font-size: 10px; color: var(--text-3); text-transform: uppercase; margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; }
  .badges {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .badge { background: var(--badge-bg); padding: 2px 8px; border-radius: var(--r-pill); }
  .badge.sys { color: var(--c-sys); }
  .badge.act { color: var(--c-act); }
  .badge.arc { color: var(--c-arc); }
  .badge.tok { color: var(--text-mute); }
  .badge.meta { color: var(--text-3); }
  aside .stats {
    font-size: 11px;
    color: var(--text-mute);
    padding: 6px 10px;
    margin-bottom: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
  }
  aside .stats .pill {
    display: inline-block;
    margin-right: 6px;
  }
  aside .stats .pill.sys { color: var(--c-sys); }
  aside .stats .pill.act { color: var(--c-act); }
  aside .stats .pill.arc { color: var(--c-arc); }
  aside .stats .pill.merge {
    color: var(--c-merge);
    cursor: help;
  }
  aside button.consolidate {
    width: 100%;
    background: var(--bg);
    color: var(--c-merge);
    border: 1px solid var(--border);
    padding: 7px;
    border-radius: var(--r-pill);
    cursor: pointer;
    margin-top: 6px;
    font-size: 12px;
  }
  aside button.consolidate:hover { background: var(--surface-2); }
  aside button.consolidate:disabled { opacity: 0.5; cursor: default; }
  .pending {
    align-self: flex-start;
    color: var(--text-2);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    max-width: 720px;
  }
  .pending .spinner {
    width: 12px;
    height: 12px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .pending .trace {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 4px;
    white-space: pre;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  form#composer {
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
  }
  #composer textarea {
    flex: 1;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 10px 14px;
    font: inherit;
    resize: none;
    min-height: 48px;
  }
  #composer textarea:focus {
    outline: none;
    border-color: var(--text-mute);
  }
  #composer button {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    padding: 0 22px;
    border-radius: var(--r-pill);
    cursor: pointer;
    font-weight: 600;
    transition: background 0.12s ease;
  }
  #composer button:hover { background: var(--accent-hover); }
  #composer button:disabled { opacity: 0.5; }
  /* skill hover preview */
  #skillPop {
    position: fixed;
    display: none;
    z-index: 20;
    width: 340px;
    max-height: 60vh;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  #skillPop.show { display: block; }
  #skillPop .pop-name { font-size: 13px; font-weight: 600; color: var(--text); font-family: var(--font-display); }
  #skillPop .pop-tier { font-size: 10px; color: var(--text-mute); margin-left: 6px; }
  #skillPop .pop-desc { font-size: 11px; color: var(--text-3); margin: 4px 0 8px; }
  #skillPop .pop-body {
    font-size: 11px;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    font-family: var(--font-mono);
  }

  /* confirm modal */
  #confirm {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }
  #confirm.show { display: flex; }
  #confirm .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: var(--r-card);
    min-width: 300px;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  #confirm .msg { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }
  #confirm .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #confirm button {
    border: none;
    padding: 8px 18px;
    border-radius: var(--r-pill);
    cursor: pointer;
    font-size: 13px;
  }
  #confirm .cancel { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border-strong); }
  #confirm .cancel:hover { background: var(--surface-3); }
  #confirm .ok { background: var(--danger); color: var(--danger-fg); }
  #confirm .ok:hover { filter: brightness(1.08); }

  /* login overlay */
  #login {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #login.show { display: flex; }
  #login .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: var(--r-card);
    min-width: 280px;
    box-shadow: var(--shadow);
  }
  #login h1 { margin: 0 0 16px; font-size: 18px; font-family: var(--font-display); }
  #login .user {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    margin-bottom: 8px;
    cursor: pointer;
  }
  #login .user:hover { background: var(--surface-2); }
  .empty { color: var(--text-mute); font-style: italic; padding: 4px 8px; }

  /* ---- responsive: small screens ---- */
  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    aside {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 260px;
      max-width: 82vw;
      z-index: 25;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: var(--shadow);
    }
    aside.open { transform: translateX(0); }
    #sidebarBackdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 24;
    }
    #sidebarBackdrop.show { display: block; }
    #menuToggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      line-height: 1;
      font-size: 16px;
    }
    header { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
    header .who { font-size: 14px; }
    header select, header button { padding: 5px 10px; font-size: 12px; }
    #chat { padding: 12px; }
    .msg { max-width: 100%; }
    .pending { max-width: 100%; }
    form#composer { padding: 8px 10px; }
    #skillPop { width: auto; left: 8px !important; right: 8px; max-width: none; }
  }
</style>
<script>
  // Apply theme before first paint to avoid a flash.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("agent_theme"); } catch (e) {}
    var theme = stored
      || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>Sign in</h1>
    <div id="googleBtnContainer"></div>
    <p id="loginError" style="color:var(--danger);font-size:12px;margin-top:12px;display:none"></p>
    <p id="loginHint" style="color:var(--text-mute);font-size:11px;margin-top:12px;">
      Sign in with Google to continue.
    </p>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<div id="skillPop"></div>
<div id="confirm">
  <div class="card">
    <div class="msg" id="confirmMsg"></div>
    <div class="actions">
      <button type="button" class="cancel" id="confirmCancel">Cancel</button>
      <button type="button" class="ok" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="sidebarBackdrop"></div>
  <aside>
    <button id="newSession" style="width:100%;background:var(--accent);color:var(--accent-fg);border:none;padding:9px;border-radius:var(--r-pill);cursor:pointer;flex:0 0 auto;font-weight:600">+ New chat</button>
    <div class="section open" id="sessionsSection">
      <button type="button" class="section-toggle" data-section="sessionsSection">Sessions</button>
      <div class="section-content">
        <ul id="sessions"></ul>
      </div>
    </div>
    <div class="section open" id="skillsSection">
      <button type="button" class="section-toggle" data-section="skillsSection">Skills</button>
      <div class="section-content">
        <div class="stats" id="skillStats" style="display:none"></div>
        <button class="consolidate" id="consolidateBtn" style="display:none">Consolidate sessions…</button>
        <ul id="skills"></ul>
      </div>
    </div>
  </aside>
  <main>
    <header>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="menuToggle" type="button" title="Menu" aria-label="Toggle sidebar">☰</button>
        <div class="who" id="who"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <select id="modelSelect" title="Select model"></select>
        <button id="themeToggle" type="button" title="Toggle light/dark"><span class="icon-light">☀</span><span class="icon-dark">☾</span></button>
        <button id="endSession">End session</button>
        <button id="logout">Logout</button>
      </div>
    </header>
    <div id="chat"></div>
    <form id="composer">
      <textarea id="input" placeholder="Type your message…" rows="2"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const DEFAULT_MODEL = "gemini-3.5-flash";
const MODEL_STORAGE_KEY = "agent_model";
const SESSION_STORAGE_KEY = "agent_session";
let sessionId = null;
let me = null;
let turnsThisSession = 0;
let currentModel = localStorage.getItem(MODEL_STORAGE_KEY) || DEFAULT_MODEL;
const THEME_STORAGE_KEY = "agent_theme";

function currentTheme() {
  return document.documentElement.getAttribute("data-theme") || "light";
}

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (e) {}
}

$("themeToggle").onclick = () => {
  setTheme(currentTheme() === "dark" ? "light" : "dark");
};

async function api(path, opts = {}) {
  const r = await fetch(path, {
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (r.status === 401) {
    showLogin();
    throw new Error("unauthorized");
  }
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function onGoogleSignIn(response) {
  $("loginError").style.display = "none";
  try {
    const r = await fetch("/api/login/google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ credential: response.credential }),
    });
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(`${r.status} ${txt}`);
    }
    location.reload();
  } catch (e) {
    $("loginError").textContent = `Login failed: ${e.message}`;
    $("loginError").style.display = "block";
  }
}
window.onGoogleSignIn = onGoogleSignIn;

async function showLogin() {
  $("app").style.display = "none";
  $("login").classList.add("show");
  $("loginError").style.display = "none";

  const cfg = await fetch("/api/config").then((r) => r.json()).catch(() => ({}));
  const clientId = cfg.google_client_id;
  const container = $("googleBtnContainer");
  container.innerHTML = "";

  if (!clientId) {
    $("loginError").textContent =
      "GOOGLE_CLIENT_ID not configured on server. Set the env var and restart.";
    $("loginError").style.display = "block";
    return;
  }

  const renderBtn = () => {
    if (!window.google || !window.google.accounts || !window.google.accounts.id) {
      setTimeout(renderBtn, 100);
      return;
    }
    window.google.accounts.id.initialize({
      client_id: clientId,
      callback: onGoogleSignIn,
    });
    window.google.accounts.id.renderButton(container, {
      type: "standard",
      theme: currentTheme() === "dark" ? "filled_black" : "outline",
      size: "large",
      text: "signin_with",
      shape: "rectangular",
    });
  };
  renderBtn();
}

function renderBadges(loaded, tokens, meta) {
  const parts = [];
  for (const n of loaded.system || []) parts.push(`<span class="badge sys">sys:${n}</span>`);
  for (const n of loaded.active || []) parts.push(`<span class="badge act">act:${n}</span>`);
  for (const n of loaded.archive || []) parts.push(`<span class="badge arc">arc:${n}</span>`);
  if (tokens && tokens.total) {
    parts.push(`<span class="badge tok">in:${tokens.in} out:${tokens.out} total:${tokens.total}</span>`);
  }
  if (meta) {
    const memTip = `catalog:${meta.catalog} scoped_bodies:${meta.scoped_bodies} body_chars:${meta.scoped_body_chars}/${meta.total_body_chars} history:${meta.history_sent}/${meta.history_full}`;
    parts.push(`<span class="badge meta" title="${escapeHtml(memTip)}">memory: ${meta.scoped_bodies}/${meta.catalog} skills · ${meta.scoped_body_chars}ch</span>`);
  }
  return parts.length ? `<div class="badges">${parts.join("")}</div>` : "";
}

function appendMessage(role, text, loaded = null, tokens = null, meta = null) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="role">${role}</div><div class="body"></div>`;
  div.querySelector(".body").textContent = text;
  if (loaded) div.insertAdjacentHTML("beforeend", renderBadges(loaded, tokens, meta));
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
}

async function refreshSidebar() {
  const [sessions, skills] = await Promise.all([
    api("/api/sessions"),
    api("/api/skills"),
  ]);
  const sList = $("sessions");
  sList.innerHTML = sessions.length
    ? ""
    : '<li class="empty">none yet</li>';
  for (const s of sessions) {
    const li = document.createElement("li");
    if (s.session_id === sessionId) li.classList.add("active");
    li.innerHTML = `<div>${escapeHtml(s.first_message || "(empty)")}</div><div class="meta">${s.turns} turns · ${s.last_ts.slice(0, 16)}</div>`;
    li.onclick = () => loadSession(s.session_id);
    sList.appendChild(li);
  }
  const skList = $("skills");
  skList.innerHTML = skills.length
    ? ""
    : '<li class="empty">no memories yet</li>';
  for (const s of skills) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="tier">[${s.tier[0]}]</span>${escapeHtml(s.name)}<button class="del" data-name="${escapeHtml(s.name)}">×</button><div class="meta">${escapeHtml(s.description)}</div>`;
    li.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      const name = e.target.dataset.name;
      hideSkillPop();
      if (!(await confirmModal(`Delete skill "${name}"? This cannot be undone.`))) return;
      await api(`/api/skill/${encodeURIComponent(name)}`, { method: "DELETE" });
      refreshSidebar();
    };
    li.addEventListener("mouseenter", () => showSkillPop(li, s));
    li.addEventListener("mouseleave", scheduleHideSkillPop);
    skList.appendChild(li);
  }

  // catalog stats
  const counts = { system: 0, active: 0, archive: 0 };
  let sessionRollups = 0;
  for (const s of skills) {
    counts[s.tier] = (counts[s.tier] || 0) + 1;
    if (s.tier === "active" && s.name.startsWith("session-")) sessionRollups += 1;
  }
  if (skills.length) {
    const parts = [
      `<span class="pill sys">sys ${counts.system}</span>`,
      `<span class="pill act">act ${counts.active}</span>`,
      `<span class="pill arc">arc ${counts.archive}</span>`,
    ];
    if (sessionRollups >= 1) {
      parts.push(
        `<span class="pill merge" title="${sessionRollups} session-* rollups in active tier — merge them into archive with the button below">⚑ ${sessionRollups} rollups</span>`,
      );
    }
    $("skillStats").innerHTML = parts.join("");
    $("skillStats").style.display = "block";
  } else {
    $("skillStats").style.display = "none";
  }
  $("consolidateBtn").style.display = sessionRollups >= 3 ? "block" : "none";
  $("consolidateBtn").textContent = `Consolidate ${sessionRollups} sessions…`;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// ---------- skill hover preview ----------
const skillBodyCache = {};
let skillPopToken = 0;
let skillPopHideTimer = null;

function initSkillPop() {
  const pop = $("skillPop");
  pop.addEventListener("mouseenter", () => clearTimeout(skillPopHideTimer));
  pop.addEventListener("mouseleave", scheduleHideSkillPop);
}

function scheduleHideSkillPop() {
  clearTimeout(skillPopHideTimer);
  skillPopHideTimer = setTimeout(hideSkillPop, 150);
}

async function showSkillPop(li, s) {
  clearTimeout(skillPopHideTimer);
  const pop = $("skillPop");
  const token = ++skillPopToken;
  const tier = `<span class="pop-tier">[${escapeHtml(s.tier)}]</span>`;
  const head =
    `<div class="pop-name">${escapeHtml(s.name)}${tier}</div>` +
    `<div class="pop-desc">${escapeHtml(s.description)}</div>`;
  let body = skillBodyCache[s.name];
  pop.innerHTML = head + `<pre class="pop-body">${escapeHtml(body ?? "loading…")}</pre>`;
  positionSkillPop(li, pop);
  pop.classList.add("show");
  if (body === undefined) {
    try {
      const full = await api(`/api/skill/${encodeURIComponent(s.name)}`);
      body = skillBodyCache[s.name] = full.body || "(empty)";
    } catch {
      body = "(failed to load)";
    }
    if (token !== skillPopToken) return; // moved to another row
    pop.innerHTML = head + `<pre class="pop-body">${escapeHtml(body)}</pre>`;
    positionSkillPop(li, pop);
  }
}

function positionSkillPop(li, pop) {
  const r = li.getBoundingClientRect();
  pop.style.left = `${r.right + 8}px`;
  const top = Math.min(r.top, window.innerHeight - pop.offsetHeight - 8);
  pop.style.top = `${Math.max(8, top)}px`;
}

function hideSkillPop() {
  skillPopToken++;
  $("skillPop").classList.remove("show");
}

// ---------- confirm modal ----------
function confirmModal(message) {
  return new Promise((resolve) => {
    const box = $("confirm");
    $("confirmMsg").textContent = message;
    const done = (val) => {
      box.classList.remove("show");
      $("confirmOk").onclick = null;
      $("confirmCancel").onclick = null;
      box.onclick = null;
      resolve(val);
    };
    $("confirmOk").onclick = () => done(true);
    $("confirmCancel").onclick = () => done(false);
    box.onclick = (e) => { if (e.target === box) done(false); };
    box.classList.add("show");
  });
}

function createPending() {
  const div = document.createElement("div");
  div.className = "pending";
  div.innerHTML = `
    <div class="spinner"></div>
    <div>
      <div class="status">Starting…</div>
      <div class="trace"></div>
    </div>`;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  const trace = [];
  return {
    update(msg) {
      div.querySelector(".status").textContent = msg;
      trace.push(msg);
      div.querySelector(".trace").textContent = trace.slice(0, -1).join(" → ");
      $("chat").scrollTop = $("chat").scrollHeight;
    },
    remove() {
      div.remove();
    },
  };
}

async function send(message) {
  closeSidebar();
  appendMessage("user", message);
  $("send").disabled = true;
  const pending = createPending();
  let finalEvent = null;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message, model: currentModel }),
    });
    if (res.status === 401) {
      pending.remove();
      showLogin();
      return;
    }
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s) continue;
        let ev;
        try { ev = JSON.parse(s); } catch { continue; }
        handleStreamEvent(ev, pending, (f) => (finalEvent = f));
      }
    }
    if (buf.trim()) {
      try {
        handleStreamEvent(JSON.parse(buf), pending, (f) => (finalEvent = f));
      } catch {}
    }
    pending.remove();
    if (finalEvent) {
      appendMessage("agent", finalEvent.answer, finalEvent.loaded, finalEvent.tokens, finalEvent.meta);
      if (finalEvent.edits && finalEvent.edits.length) {
        const note = document.createElement("div");
        note.className = "badges";
        note.style.alignSelf = "flex-start";
        note.innerHTML = finalEvent.edits
          .map((e) => `<span class="badge act">memory: ${escapeHtml(e)}</span>`)
          .join("");
        $("chat").appendChild(note);
      }
      turnsThisSession += 1;
      refreshSidebar();
    }
  } catch (e) {
    pending.remove();
    appendMessage("agent", `[error: ${e.message}]`);
  } finally {
    $("send").disabled = false;
  }
}

function handleStreamEvent(ev, pending, setFinal) {
  if (ev.stage === "init" && ev.session_id) {
    sessionId = ev.session_id;
    try { localStorage.setItem(SESSION_STORAGE_KEY, sessionId); } catch (e) {}
    return;
  }
  if (ev.stage === "error") {
    pending.update(`error: ${ev.msg}`);
    return;
  }
  if (ev.stage === "done") {
    setFinal(ev);
    return;
  }
  if (ev.msg) pending.update(ev.msg);
}

async function loadSession(sid) {
  if (!sid) return;
  let data;
  try {
    data = await api(`/api/session/${encodeURIComponent(sid)}`);
  } catch (e) {
    try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (_) {}
    return;
  }
  const turns = data.turns || [];
  if (!turns.length) {
    try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (_) {}
    return;
  }
  sessionId = sid;
  turnsThisSession = turns.filter((t) => t.role === "user").length;
  try { localStorage.setItem(SESSION_STORAGE_KEY, sid); } catch (e) {}
  $("chat").innerHTML = "";
  for (const t of turns) {
    appendMessage(t.role === "model" ? "agent" : "user", t.text);
  }
  closeSidebar();
  refreshSidebar();
}

async function init() {
  try {
    const r = await fetch("/api/me", { credentials: "same-origin" });
    if (r.status === 401) {
      await showLogin();
      return;
    }
    if (!r.ok) throw new Error(`/api/me ${r.status}`);
    me = await r.json();
  } catch (e) {
    console.error("init failed:", e);
    await showLogin();
    return;
  }
  $("login").classList.remove("show");
  $("app").style.display = "grid";
  $("who").innerHTML = `${escapeHtml(me.display_name)}`;
  initModelSelect(me.allowed_models || [DEFAULT_MODEL]);
  await refreshSidebar();
  let stored = null;
  try { stored = localStorage.getItem(SESSION_STORAGE_KEY); } catch (e) {}
  if (stored) await loadSession(stored);
}

function initModelSelect(allowed) {
  const sel = $("modelSelect");
  if (!allowed.includes(currentModel)) {
    currentModel = DEFAULT_MODEL;
    localStorage.setItem(MODEL_STORAGE_KEY, currentModel);
  }
  sel.innerHTML = "";
  for (const m of allowed) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    if (m === currentModel) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    currentModel = sel.value;
    localStorage.setItem(MODEL_STORAGE_KEY, currentModel);
  };
}

// ---------- mobile sidebar drawer ----------
function openSidebar() {
  document.querySelector("aside").classList.add("open");
  $("sidebarBackdrop").classList.add("show");
}
function closeSidebar() {
  document.querySelector("aside").classList.remove("open");
  $("sidebarBackdrop").classList.remove("show");
}
$("menuToggle").onclick = () => {
  document.querySelector("aside").classList.contains("open") ? closeSidebar() : openSidebar();
};
$("sidebarBackdrop").onclick = closeSidebar;

for (const btn of document.querySelectorAll(".section-toggle")) {
  btn.addEventListener("click", () => {
    $(btn.dataset.section).classList.toggle("open");
  });
}

initSkillPop();

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("input").value.trim();
  if (!v) return;
  $("input").value = "";
  send(v);
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

$("newSession").onclick = () => {
  flushSessionBeacon();
  sessionId = null;
  turnsThisSession = 0;
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
  $("chat").innerHTML = "";
  closeSidebar();
};

$("endSession").onclick = async () => {
  if (!sessionId) return;
  const res = await api("/api/session/end", {
    method: "POST",
    body: JSON.stringify({ session_id: sessionId }),
  });
  if (res.saved) appendMessage("agent", `[session summarized → ${res.saved}]`);
  sessionId = null;
  turnsThisSession = 0;
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
  $("chat").innerHTML = "";
  refreshSidebar();
};

$("logout").onclick = async () => {
  flushSessionBeacon();
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
  await fetch("/api/logout", { method: "POST" });
  location.reload();
};

$("consolidateBtn").onclick = async () => {
  const btn = $("consolidateBtn");
  if (!confirm("Run consolidation? Folds all session-* skills into one archive skill and deletes the originals. Idempotent — safe to re-run.")) return;
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Consolidating…";
  try {
    const res = await api("/api/consolidate", {
      method: "POST",
      body: JSON.stringify({ dry_run: false }),
    });
    let msg;
    if (res.merged_archive_skill) {
      const deleted = (res.deleted_session_skills || []).length;
      msg = `Merged ${res.input_sessions} session rollup(s) → ${res.merged_archive_skill}\nDeleted ${deleted} source skill(s).`;
    } else {
      msg = res.reason || "Nothing to consolidate.";
    }
    alert(msg);
    refreshSidebar();
  } catch (e) {
    alert(`Consolidate failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

// Explicit summarize-on-leave (new chat / logout). NOT bound to page
// unload — a refresh must preserve the live session, not end it.
function flushSessionBeacon() {
  if (!sessionId || turnsThisSession < 1) return;
  try {
    const blob = new Blob(
      [JSON.stringify({ session_id: sessionId })],
      { type: "application/json" },
    );
    navigator.sendBeacon("/api/session/end", blob);
  } catch (e) {
    // best-effort
  }
}

init();
</script>
</body>
</html>
